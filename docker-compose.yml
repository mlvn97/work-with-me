name: work-with-me

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the environment or root .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the environment or root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: workwithme-api:local
    build:
      context: ./workwithme-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in the environment or root .env file}
      DATABASE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in the environment or root .env file}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or root .env file}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: workwithme-web:local
    build:
      context: ./workwithme-web
    ports:
      - "3000:80"

volumes:
  postgres_data: