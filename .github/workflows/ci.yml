name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workwithme_test
        ports:
          - 5432:5432

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Download Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build avec Maven
        run: mvn -B clean install
        working-directory: ./workwithme-api
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/workwithme_test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres

      - name: Run tests
        run: mvn test
        working-directory: ./workwithme-api
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/workwithme_test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workwithme-web/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: ./workwithme-web
