name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

jobs: 
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: self-hosted
    environment: work-with-me
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build and restart application
        env:
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -eu
          : "${POSTGRES_DB:?Add POSTGRES_DB to GitHub Actions variables}"
          : "${POSTGRES_USER:?Add POSTGRES_USER to GitHub Actions variables}"
          : "${POSTGRES_PASSWORD:?Add POSTGRES_PASSWORD to GitHub Actions secrets}"
          docker compose up -d --build --remove-orphans